spring:
  application:
    name: adolf_siagian-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  # Render memberi variabel PORT; lokal memakai APP_PORT dari .env (default 8080)
  port: ${PORT:${APP_PORT:8080}}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true